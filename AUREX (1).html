</style></head><body>
<div id="toast" role="status"></div>
<header id="top"><button id="cons" style="visibility:hidden" aria-label="Open admin console">Console</button><b>₳ AUREX</b><button id="info" class="ib" aria-label="How it works">i</button></header>
<main id="app"><p class="small" style="text-align:center;padding:40px 0">Loading…</p></main>
<nav id="nav" hidden></nav>
<script>
const $=s=>document.querySelector(s);
const STK=[["TSLA","Tesla","Auto",.007,.0001,248],["SPCX","SpaceX","Space",.008,.0001,182],["AMZN","Amazon","Retail",.005,.0001,191],["KFC","KFC","Food",.003,0,38],["SMSN","Samsung","Electronics",.004,0,67]];
const FEE=.001;
let DB={users:{},promos:{},adminLog:[],session:null,rate:2};
try{const d=JSON.parse(localStorage.getItem("pb_mkt")||"null");if(d){DB.mkt=d.mkt;DB.mv=d.mv}}catch(e){}
const EM="@aurex.app",ADMIN_EMAIL="admin@aurex.app";
let lastPush="",pushT=0,unsub=null,authBusy=false;
const snap=d=>{const c={...d};delete c.nw;return JSON.stringify(c,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:1)):v)};
const save=()=>{try{localStorage.setItem("pb_mkt",JSON.stringify({mkt:DB.mkt,mv:DB.mv}))}catch(e){}clearTimeout(pushT);pushT=setTimeout(pushUser,500)};
function pushUser(){const u=me();if(!u||!window.FB||!FB.auth.currentUser)return;const j=snap(u);if(j===lastPush)return;lastPush=j;const d=JSON.parse(j);d.nw=r2(netWorth(u));FB.setDoc(FB.doc(FB.fs,"users",FB.auth.currentUser.uid),d).catch(()=>toast("Couldn’t sync. Check your connection"))}
const isAdmin=()=>!!(window.FB&&FB.auth.currentUser&&FB.auth.currentUser.email===ADMIN_EMAIL);
const setCons=()=>{$("#cons").style.visibility=isAdmin()?"visible":"hidden"};
async function loadShared(){try{const p=await FB.getDocs(FB.collection(FB.fs,"promos"));DB.promos={};p.forEach(x=>DB.promos[x.id]=x.data());const c=await FB.getDoc(FB.doc(FB.fs,"config","app"));if(c.exists()&&c.data().rate>0)DB.rate=c.data().rate}catch(e){}}
async function attach(user){
  const s=await FB.getDoc(FB.doc(FB.fs,"users",user.uid));
  if(!s.exists()){await FB.signOut(FB.auth);toast("This account was removed");return render()}
  const d=s.data();if(d.banned){await FB.signOut(FB.auth);toast("This account is suspended");return render()}
  ensure(d);DB.users={[d.key]:d};DB.session=d.key;lastPush=snap(d);
  if(unsub)unsub();
  unsub=FB.onSnapshot(FB.doc(FB.fs,"users",user.uid),sn=>{if(!sn.exists()||sn.metadata.hasPendingWrites)return;const r=sn.data();ensure(r);if(snap(r)===lastPush)return;if(r.banned){logout();toast("This account is suspended");return}DB.users[r.key]=r;lastPush=snap(r);if(!$("#md")&&!$("#sg")&&tab==="home")render()});
  setCons();await loadShared();render();
}
async function logout(){if(unsub){unsub();unsub=null}DB.session=null;DB.users={};lastPush="";try{await FB.signOut(FB.auth)}catch(e){}setCons();render()}
const me=()=>DB.users[DB.session];
const r2=n=>Math.round(n*100)/100;
const fmt=n=>"₳ "+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const px=n=>Number(n).toFixed(2);
const pct=n=>(n>=0?"+":"−")+Math.abs(n*100).toFixed(2)+"%";
const pick=a=>a[Math.floor(Math.random()*a.length)];
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2600)}
function log(u,type,amt,note){u.tx.unshift({t:Date.now(),type,amt,note});u.tx=u.tx.slice(0,200)}
function alog(m){DB.adminLog=DB.adminLog||[];DB.adminLog.unshift({t:Date.now(),m});DB.adminLog=DB.adminLog.slice(0,200)}
function ensure(u){u.pf=u.pf||{};u.orders=u.orders||[];u.trades=u.trades||[];u.realized=u.realized||0;u.tx=u.tx||[];u.used=u.used||[];u.stats=u.stats||{played:0,won:0};if(!/^#/.test(u.avatar||"")||u.avatar==="#b88a2e")u.avatar="#475569"}
const av=(u,s=34)=>`<span class="av" style="background:${u.avatar};width:${s}px;height:${s}px;font-size:${Math.round(s*.45)}px">${esc((u.name||"?")[0]).toUpperCase()}</span>`;
const IC={rates:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',play:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/>',stocks:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',rewards:'<rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8c-2 0-4-1-4-3s3-2 4 3zm0 0c2 0 4-1 4-3s-3-2-4 3z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const ico=(k,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const head=(k,t)=>`<div class="ph">${ico(k,26)}<h2>${t}</h2></div>`;
/* ---------- market engine ---------- */
function step(){
  const M=DB.mkt,m=randn()*.0015,sec={};M.trend=(M.trend||0)*.97+randn()*.0001;
  for(const [sym,n,sc,vol,dr,p0] of STK){
    const st=M.s[sym];if(!(sc in sec))sec[sc]=randn()*.002;
    const r=dr+M.trend+(.7+vol*25)*m+sec[sc]+randn()*vol+.003*Math.log(p0/st.p)+st.shock;
    st.shock*=.6;st.p=Math.max(1,st.p*Math.exp(r));st.h.push(st.p);if(st.h.length>200)st.h.shift();
  }
  if(Math.random()<.02)newsEvent();
}
function newsEvent(){
  const M=DB.mkt;
  const T=[["{n} reports record sales",1],["{n} wins a big deal",1],["{n} launches a hit product",1],["Experts upgrade {n}",1],["{n} misses its targets",-1],["{n} faces an investigation",-1],["{n} recalls a product",-1],["Experts downgrade {n}",-1]];
  const S=[["Auto","Electric car sales hit a new high",1],["Auto","Chip shortage slows car makers",-1],["Space","Rocket launch goes perfectly",1],["Space","Launch delay worries investors",-1],["Retail","Shopping boom lifts online stores",1],["Food","Rising food costs hit restaurants",-1],["Electronics","New phone demand surges",1],["Electronics","Chip prices drop",-1]];
  let n;
  if(Math.random()<.35){const e=pick(S);STK.forEach(s=>{if(s[2]===e[0])M.s[s[0]].shock+=e[2]*(.005+Math.random()*.005)});n={t:Date.now(),txt:e[1],sym:"",dir:e[2]}}
  else{const s=pick(STK),e=pick(T);M.s[s[0]].shock+=e[1]*(.006+Math.random()*.01);n={t:Date.now(),txt:e[0].replace("{n}",s[1]),sym:s[0],dir:e[1]}}
  M.news.unshift(n);M.news=M.news.slice(0,20);
}
function initMkt(){const s={};STK.forEach(([sym,,,,,p0])=>s[sym]={p:p0,h:[p0],shock:0});DB.mkt={s,trend:0,news:[],t:Date.now()};DB.mv=3;for(let i=0;i<150;i++)step();DB.mkt.news=[]}
function execTrade(u,sym,side,q,p){
  const gross=r2(q*p),fee=Math.max(.01,r2(gross*FEE));
  if(side==="buy"){
    const cost=r2(gross+fee);if(u.bal<cost)return{ok:0,msg:"Not enough AUREX"};
    u.bal=r2(u.bal-cost);const h=u.pf[sym]||(u.pf[sym]={q:0,avg:0});h.avg=(h.avg*h.q+cost)/(h.q+q);h.q+=q;
    log(u,"out",cost,`Bought ${q} ${sym} @ ${px(p)}`);
  }else{
    const h=u.pf[sym];if(!h||h.q<q)return{ok:0,msg:"Not enough shares"};
    const pro=r2(gross-fee);u.realized=r2((u.realized||0)+pro-h.avg*q);h.q-=q;if(h.q<=0)delete u.pf[sym];
    u.bal=r2(u.bal+pro);log(u,"in",pro,`Sold ${q} ${sym} @ ${px(p)}`);
  }
  u.trades.unshift({t:Date.now(),sym,side,q,px:p,fee});u.trades=u.trades.slice(0,100);
  return{ok:1,msg:(side==="buy"?"Bought ":"Sold ")+q+" "+sym+" @ "+px(p)};
}
function processOrders(){
  const M=DB.mkt;
  for(const u of Object.values(DB.users)){
    if(!u.orders.length)continue;
    u.orders=u.orders.filter(o=>{
      const p=r2(M.s[o.sym].p);
      const hit=o.type==="limit"?(o.side==="buy"?p<=o.px:p>=o.px):(o.side==="buy"?p>=o.px:p<=o.px);
      if(!hit)return true;
      const r=execTrade(u,o.sym,o.side,o.q,p);
      if(!r.ok)log(u,"in",0,"Order cancelled: "+r.msg);
      else if(u===me())toast("Order filled: "+r.msg);
      return false;
    });
  }
}
function tickMarket(n){for(let i=0;i<n;i++){step();processOrders()}DB.mkt.t=Date.now()}
const hv=u=>Object.entries(u.pf).reduce((s,[k,h])=>s+h.q*DB.mkt.s[k].p,0);
const netWorth=u=>u.bal+hv(u);
function idxSeries(){const n=Math.min(...STK.map(s=>DB.mkt.s[s[0]].h.length));return Array.from({length:n},(_,i)=>1000*STK.reduce((a,s)=>{const h=DB.mkt.s[s[0]].h;return a+h[h.length-n+i]/s[5]},0)/STK.length)}
/* ---------- app ---------- */
let tab="home";const S={sub:"mkt",sel:"TSLA",rng:100,side:"buy",qty:1};
const TABS=[["home","Home"],["stocks","Stocks"],["rates","Rates"],["rewards","Rewards"],["acct","Account"]];
function stocksGate(){
  const d=document.createElement("div");d.className="modal";d.id="sg";
  d.innerHTML=`<div><h2>Before you trade</h2><p class="small">Please read this first.</p>
  <div class="small" style="line-height:1.55;color:var(--ink)"><p><b>How stocks work.</b> A stock is a small piece of a company. When more people want it, the price goes up. When fewer people want it, the price goes down.</p><p><b>Buy low, sell high.</b> Buy a stock now and sell it later. If the price is higher than when you bought it, you make a profit. If it is lower, you make a loss.</p><p><b>Prices are simulated.</b> Tesla, SpaceX, Amazon, KFC and Samsung use made-up prices that change every 2 seconds. They are not real and have no connection to the companies.</p><p><b>Rules.</b> AUREX has no cash value and cannot be withdrawn. Trades are in whole shares with a 0.1% fee. You can lose AUREX. Nothing here is financial advice.</p></div>
  <div class="grid" style="margin-top:12px"><button class="alt" id="sgb">Back</button><button id="sgc" disabled>Continue in 5</button></div></div>`;
  document.body.appendChild(d);let n=5;
  const t=setInterval(()=>{const b=$("#sgc");if(!b){clearInterval(t);return}n--;if(n>0)b.textContent="Continue in "+n;else{clearInterval(t);b.disabled=false;b.textContent="I understand"}},1000);
  $("#sgb").onclick=()=>{clearInterval(t);d.remove();tab="home";render()};
  $("#sgc").onclick=()=>d.remove();
}
function render(){
  const u=me(),nav=$("#nav");
  if(!u||u.banned){if(u){DB.session=null;save()}nav.hidden=true;return authView()}
  nav.hidden=false;
  nav.innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}" aria-label="${l}">${ico(k==="acct"?"user":k)}${l}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{const g=b.dataset.t==="stocks"&&tab!=="stocks";tab=b.dataset.t;render();if(g)stocksGate()});
  ({home:homeView,stocks:stocksView,rates:ratesView,rewards:rewardsView,acct:acctView})[tab](u);
}
function authView(){
  $("#app").innerHTML=`<div class="card hero"><h1>₳ AUREX</h1><p>A virtual wallet for stocks and transfers. No real money. No cash-out.</p></div>

    try{await FB.runTransaction(FB.fs,async t=>{const r=FB.doc(FB.fs,"promos",c),s=await t.get(r);if(!s.exists())throw"nf";const d=s.data();if(d.max&&(d.count||0)>=d.max)throw"full";amt=d.amt;t.update(r,{count:(d.count||0)+1})})}
    catch(e){return toast(e==="full"?"Code fully claimed":e==="nf"?"Code not found":"Couldn’t redeem. Try again")}
    u.used.push(c);u.bal=r2(u.bal+amt);log(u,"in",amt,"Promo "+c);save();toast("+"+amt+" AUREX");render()};
}

function modal(h){closeModal();const m=document.createElement("div");m.className="modal";m.id="md";m.innerHTML="<div>"+h+"</div>";m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}

async function loadAdmin(){const q=await FB.getDocs(FB.collection(FB.fs,"users"));ADM.u=[];q.forEach(x=>{const d=x.data();ensure(d);ADM.u.push([x.id,d])});

function adminGate(){if(!isAdmin())return toast("Admin only");adminView()}
async function adminView(){

  $("#md>div").scrollTop=sc;$("#cx").onclick=closeModal;

  $("#pcm").onclick=async()=>{const c=$("#pcn").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""),a=+$("#pca").value;if(!c||!(a>0))return toast("Enter a code and an amount");const mx=Math.floor(+$("#pcx").value)||20;
